name: Публикация на GitHub Pages

# Витрина для быстрого показа: открыл ссылку — играешь.
# Сетевые режимы тут не работают, для них нужен сервер комнат на Cloudflare;
# соло и версус с ботом доступны полностью.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Проверки перед публикацией: незачем выкладывать то, что не собирается
      # или не проходит тесты симуляции.
      - run: npx tsc --noEmit
      - run: npx vitest run

      # На Pages сайт лежит не в корне домена, а в подпапке с именем репозитория.
      - run: npx vite build --base=/element-td/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
